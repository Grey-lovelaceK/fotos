<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrchMonitor - Sistema de Monitoreo de Orquídeas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .notification-item {
        animation: fadeIn 0.3s ease-out;
      }
      .gauge-circle {
        transition: stroke-dasharray 0.5s ease-out;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 p-4">
    <div class="max-w-7xl mx-auto">
      <header class="bg-white rounded-lg shadow-lg p-6 mb-6">
        <div class="flex justify-between items-center flex-wrap gap-4">
          <div>
            <h1
              class="text-3xl font-bold text-green-800 flex items-center gap-2"
            >
              🌸 OrchMonitor
            </h1>
            <p class="text-gray-600">
              Sistema de Monitoreo Inteligente de Orquídeas
            </p>
          </div>
          <div class="text-right">
            <div
              id="currentTime"
              class="text-2xl font-semibold text-gray-800"
            ></div>
            <div id="currentDate" class="text-sm text-gray-600"></div>
          </div>
        </div>
      </header>

      <div
        id="sensorNodes"
        class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6"
      ></div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow-lg p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
              📅 Calendario de Riego
            </h2>
            <button
              onclick="toggleAddSchedule()"
              class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-blue-600 transition"
            >
              ➕ Agregar
            </button>
          </div>

          <div
            id="addScheduleForm"
            class="bg-gray-50 p-4 rounded-lg mb-4 hidden"
          >
            <div class="grid grid-cols-3 gap-2 mb-3">
              <select id="newDay" class="border rounded px-3 py-2">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
              </select>
              <input
                id="newTime"
                type="time"
                value="08:00"
                class="border rounded px-3 py-2"
              />
              <select id="newType" class="border rounded px-3 py-2">
                <option value="Manual">Manual</option>
                <option value="Automático">Automático</option>
              </select>
            </div>
            <button
              onclick="addSchedule()"
              class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition"
            >
              Guardar Horario
            </button>
          </div>

          <div id="scheduleList" class="space-y-2"></div>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6">
          <h2
            class="text-xl font-bold text-gray-800 flex items-center gap-2 mb-4"
          >
            🔔 Notificaciones y Alertas
          </h2>
          <div
            id="notificationList"
            class="space-y-2 max-h-96 overflow-y-auto"
          ></div>
        </div>
      </div>

      <footer class="mt-6 text-center text-gray-600 text-sm">
        <p>OrchMonitor v1.0 - Equipo Cultivo Inteligente de Orquídeas</p>
        <p>
          Cristian Revilla • Iván González • Ricardo Alvarado • Alejandro Franco
        </p>
      </footer>
    </div>

    <script>
      let schedules = [
        { id: 1, day: "Lunes", time: "08:00", type: "Manual", active: true },
        {
          id: 2,
          day: "Miércoles",
          time: "08:00",
          type: "Manual",
          active: true,
        },
        { id: 3, day: "Viernes", time: "08:00", type: "Manual", active: true },
      ];

      let sensorData = {
        nodo1: { temp: 21.5, humidity: 78, soilMoisture: 65, status: "online" },
        nodo2: { temp: 22.1, humidity: 82, soilMoisture: 70, status: "online" },
        nodo3: { temp: 20.8, humidity: 76, soilMoisture: 62, status: "online" },
      };

      let notifications = [];
      let alerts = [];

      function updateTime() {
        const now = new Date();
        document.getElementById("currentTime").textContent =
          now.toLocaleTimeString("es-CL");
        document.getElementById("currentDate").textContent =
          now.toLocaleDateString("es-CL", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          });
      }

      function createGauge(value, min, max, unit, label) {
        const percentage = ((value - min) / (max - min)) * 100;
        const color = value < min || value > max ? "#ef4444" : "#10b981";
        const dashArray = (percentage * 3.51).toFixed(2);

        return `
                <div class="flex flex-col items-center">
                    <div class="relative w-32 h-32">
                        <svg class="transform -rotate-90 w-32 h-32">
                            <circle cx="64" cy="64" r="56" stroke="#e5e7eb" stroke-width="8" fill="none" />
                            <circle cx="64" cy="64" r="56" stroke="${color}" stroke-width="8" fill="none"
                                stroke-dasharray="${dashArray} 351.86" class="gauge-circle" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center flex-col">
                            <span class="text-2xl font-bold">${value}</span>
                            <span class="text-xs text-gray-500">${unit}</span>
                        </div>
                    </div>
                    <span class="text-sm mt-2 text-gray-600">${label}</span>
                    <span class="text-xs text-gray-400">${min}-${max} ${unit}</span>
                </div>
            `;
      }

      function renderSensorNodes() {
        const container = document.getElementById("sensorNodes");
        container.innerHTML = "";

        Object.entries(sensorData).forEach(([node, data]) => {
          const nodeCard = document.createElement("div");
          nodeCard.className = "bg-white rounded-lg shadow-lg p-6";
          nodeCard.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-800">${node.toUpperCase()}</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-green-500">📶</span>
                            <span class="text-xs text-green-600">Online</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        ${createGauge(data.temp, 18, 24, "°C", "Temperatura")}
                        ${createGauge(
                          data.humidity,
                          75,
                          85,
                          "%",
                          "Humedad Aire"
                        )}
                    </div>
                    <div class="mt-4 flex justify-center">
                        ${createGauge(
                          data.soilMoisture,
                          60,
                          80,
                          "%",
                          "Humedad Suelo"
                        )}
                    </div>
                `;
          container.appendChild(nodeCard);
        });
      }

      function updateSensorData() {
        Object.keys(sensorData).forEach((node) => {
          sensorData[node].temp = (20 + Math.random() * 4).toFixed(1);
          sensorData[node].humidity = (75 + Math.random() * 10).toFixed(0);
          sensorData[node].soilMoisture = (60 + Math.random() * 15).toFixed(0);

          if (sensorData[node].temp < 18 || sensorData[node].temp > 24) {
            addAlert(
              `${node}: Temperatura fuera de rango (${sensorData[node].temp}°C)`,
              "warning"
            );
          }
          if (
            sensorData[node].humidity < 75 ||
            sensorData[node].humidity > 85
          ) {
            addAlert(
              `${node}: Humedad fuera de rango (${sensorData[node].humidity}%)`,
              "warning"
            );
          }
        });
        renderSensorNodes();
      }

      function renderSchedules() {
        const container = document.getElementById("scheduleList");
        container.innerHTML = "";

        schedules.forEach((schedule) => {
          const scheduleItem = document.createElement("div");
          scheduleItem.className = `flex items-center justify-between p-3 rounded-lg border-2 ${
            schedule.active
              ? "bg-green-50 border-green-200"
              : "bg-gray-50 border-gray-200"
          }`;
          scheduleItem.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${
                          schedule.active ? "checked" : ""
                        } 
                            onchange="toggleSchedule(${
                              schedule.id
                            })" class="w-5 h-5">
                        <span>🕐</span>
                        <div>
                            <div class="font-semibold">${schedule.day} - ${
            schedule.time
          }</div>
                            <div class="text-xs text-gray-500">${
                              schedule.type
                            }</div>
                        </div>
                    </div>
                    <button onclick="deleteSchedule(${
                      schedule.id
                    })" class="text-red-500 hover:text-red-700">
                        🗑️
                    </button>
                `;
          container.appendChild(scheduleItem);
        });
      }

      function toggleAddSchedule() {
        const form = document.getElementById("addScheduleForm");
        form.classList.toggle("hidden");
        requestNotificationPermission();
      }

      function addSchedule() {
        const day = document.getElementById("newDay").value;
        const time = document.getElementById("newTime").value;
        const type = document.getElementById("newType").value;

        schedules.push({
          id: Date.now(),
          day,
          time,
          type,
          active: true,
        });

        renderSchedules();
        toggleAddSchedule();
      }

      function deleteSchedule(id) {
        schedules = schedules.filter((s) => s.id !== id);
        renderSchedules();
      }

      function toggleSchedule(id) {
        const schedule = schedules.find((s) => s.id === id);
        if (schedule) {
          schedule.active = !schedule.active;
          renderSchedules();
        }
      }

      function checkSchedules() {
        const now = new Date();
        const dayNames = [
          "Domingo",
          "Lunes",
          "Martes",
          "Miércoles",
          "Jueves",
          "Viernes",
          "Sábado",
        ];
        const currentDay = dayNames[now.getDay()];
        const currentTime = `${now.getHours().toString().padStart(2, "0")}:${now
          .getMinutes()
          .toString()
          .padStart(2, "0")}`;

        schedules.forEach((schedule) => {
          if (
            schedule.active &&
            schedule.day === currentDay &&
            schedule.time === currentTime
          ) {
            sendNotification(
              `⏰ Hora de regar las orquídeas - ${schedule.type}`
            );
          }
        });
      }

      function sendNotification(message) {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("OrchMonitor", { body: message, icon: "🌸" });
        }
        notifications.push({
          id: Date.now(),
          message,
          time: new Date(),
          type: "notification",
        });
        renderNotifications();
      }

      function addAlert(message, type) {
        const exists = alerts.some((alert) => alert.message === message);
        if (!exists) {
          alerts.push({ id: Date.now(), message, type, time: new Date() });
          renderNotifications();
        }
      }

      function requestNotificationPermission() {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }

      function renderNotifications() {
        const container = document.getElementById("notificationList");
        const allItems = [...alerts, ...notifications].sort(
          (a, b) => b.time - a.time
        );

        if (allItems.length === 0) {
          container.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <div class="text-5xl mb-2">🔔</div>
                        <p>No hay notificaciones</p>
                    </div>
                `;
          return;
        }

        container.innerHTML = "";
        allItems.forEach((item) => {
          const notifItem = document.createElement("div");
          notifItem.className = "notification-item";

          if (item.type === "warning") {
            notifItem.innerHTML = `
                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded">
                            <div class="flex items-start gap-2">
                                <span class="text-yellow-600">⚠️</span>
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-gray-800">${
                                      item.message
                                    }</p>
                                    <p class="text-xs text-gray-500">${item.time.toLocaleTimeString(
                                      "es-CL"
                                    )}</p>
                                </div>
                            </div>
                        </div>
                    `;
          } else {
            notifItem.innerHTML = `
                        <div class="bg-blue-50 border-l-4 border-blue-400 p-3 rounded">
                            <div class="flex items-start gap-2">
                                <span class="text-blue-600">✅</span>
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-gray-800">${
                                      item.message
                                    }</p>
                                    <p class="text-xs text-gray-500">${item.time.toLocaleTimeString(
                                      "es-CL"
                                    )}</p>
                                </div>
                            </div>
                        </div>
                    `;
          }
          container.appendChild(notifItem);
        });
      }

      updateTime();
      setInterval(updateTime, 1000);

      renderSensorNodes();
      setInterval(updateSensorData, 5000);

      renderSchedules();
      renderNotifications();

      checkSchedules();
      setInterval(checkSchedules, 60000);
    </script>
  </body>
</html>
